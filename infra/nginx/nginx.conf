upstream user_service         { server user-service:3001; }
upstream wallet_service       { server wallet-service:3002; }
upstream ai_service           { server ai-service:3003; }
upstream notification_service { server notification-service:3004; }

server {
    listen 80;

    # CORS para dev — heredado por todos los location al no redefinirse en ninguno
    add_header Access-Control-Allow-Origin  "*"                                  always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type"        always;
    add_header Access-Control-Allow-Methods "GET, POST, PATCH, DELETE, OPTIONS"  always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Health check del gateway — responde desde nginx directamente
    location = /health {
        add_header Content-Type application/json;
        return 200 '{"status":"ok","gateway":"nginx"}';
    }

    # Bloquear endpoints internos
    location /api/internal/ {
        return 403;
    }

    # ── User Service ──────────────────────────────────────────────────────────
    location ~ ^/api/(register|login|apple|google|refresh|logout)$ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://user_service;
    }

    location /api/auth/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://user_service;
    }

    location /api/me {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://user_service;
    }

    # ── Wallet Service ────────────────────────────────────────────────────────
    # Prefijos sin barra final: matchean tanto la colección (`/api/banks`) como
    # los sub-recursos (`/api/banks/:id/wallets`). Con barra final nginx devuelve
    # 301 a la ruta de colección, rompiendo POST/GET sin barra.
    location /api/banks {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://wallet_service;
    }

    location /api/wallets {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://wallet_service;
    }

    location /api/transactions {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://wallet_service;
    }

    location /api/transfers {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://wallet_service;
    }

    location /api/categories {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://wallet_service;
    }

    location /api/recurring {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://wallet_service;
    }

    location /api/stats {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://wallet_service;
    }

    location /api/dashboard {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://wallet_service;
    }

    location /api/investment-transactions {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://wallet_service;
    }

    # ── AI Service ────────────────────────────────────────────────────────────
    location /api/insights {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://ai_service;
    }

    location /api/categorize {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://ai_service;
    }

    # ── Notification Service ──────────────────────────────────────────────────
    location /api/devices {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://notification_service;
    }

    location /api/notifications {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://notification_service;
    }
}
