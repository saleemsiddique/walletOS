[project]
name = "ai-service"
version = "0.1.0"
description = "WalletOS AI Service — auto-categorización e insights semanales"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "httpx>=0.28",
    "redis>=5.2",
    "aio-pika>=9.5",
    "boto3>=1.36",
    "openai>=1.59",
    "anthropic>=0.42",
    "tenacity>=9.0",
    "apscheduler>=3.11",
    "pandas>=2.2",
    "matplotlib>=3.10",
    "reportlab>=4.2",
    "python-jose[cryptography]>=3.3",
    "unidecode>=1.3",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
    "fakeredis>=2.26",
    "types-python-jose>=3.3",
    "moto[s3]>=5.0",
    "boto3-stubs[s3]>=1.36",
    "lupa>=2.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.flake8-bugbear]
# Llamadas de FastAPI válidas como valores por defecto de parámetros.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Body",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
