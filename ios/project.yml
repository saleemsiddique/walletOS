name: WalletOS

options:
  bundleIdPrefix: com.walletOS
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  WalletOS:
    type: application
    platform: iOS
    sources:
      - path: WalletOS
        excludes:
          - "**/.gitkeep"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.walletOS.app
        INFOPLIST_FILE: WalletOS/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: WalletOS/Resources/WalletOS.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: accent

  WalletOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WalletOSTests
    dependencies:
      - target: WalletOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.walletOS.app.tests
        GENERATE_INFOPLIST_FILE: YES
        # Hostear los unit tests en la app da identidad de app al proceso (necesario para el Keychain).
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/WalletOS.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/WalletOS"
        BUNDLE_LOADER: "$(TEST_HOST)"

  WalletOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: WalletOSUITests
    dependencies:
      - target: WalletOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.walletOS.app.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  WalletOS:
    build:
      targets:
        WalletOS: all
        WalletOSTests: [test]
        WalletOSUITests: [test]
    test:
      targets:
        - WalletOSTests
        - WalletOSUITests
